[project]
name = "sofit-cli"
version = "0.8.0"
description = "Auto-generate chapters, show notes, and pull-quotes for Hebrew podcasts (mp3/mp4) from a local transcript."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2,<2"]  # 2.0 removed mcp.server.fastmcp; code targets the 1.x API
youtube = ["yt-dlp[default]>=2026.3.3"]
render = ["pillow>=10", "python-bidi>=0.4"]
crop = ["opencv-python-headless>=4.9"]  # face-aware crop centering (optional)

[project.scripts]
sofit = "sofit.cli:main"
sofit-mcp = "sofit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sofit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
